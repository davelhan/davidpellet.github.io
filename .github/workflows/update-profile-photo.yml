name: Update portfolio profile photo

on:
  push:
    paths:
      - '.github/workflows/update-profile-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace profile photo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = './assets/web/1768736480189.webp'
          new = './assets/web/photprofile.png'
          if old not in html:
              raise RuntimeError('Current profile photo reference not found')
          html = html.replace(old, new, 1)
          p.write_text(html, encoding='utf-8')
          Path('.github/workflows/update-profile-photo.yml').unlink(missing_ok=True)
          PY

      - name: Commit profile photo update
        shell: bash
        run: |
          git config user.name "portfolio-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update portfolio profile photo"
          git push
