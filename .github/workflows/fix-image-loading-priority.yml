name: One-time image loading priority cleanup

on:
  push:
    paths:
      - '.github/workflows/fix-image-loading-priority.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image loading priorities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [Path(x) for x in (
              'index.html','wrath-of-the-druids.html','the-kib.html',
              'ghost-recon.html','south-park-phone-destroyer.html','visual-development.html'
          )]
          priority = {
              'index.html':'david-pellet-redleader-bp-garage-01',
              'wrath-of-the-druids.html':'connacht-lackanscaul',
          }

          for page in pages:
              text = page.read_text(encoding='utf-8')
              def fix(match):
                  tag = match.group(0)
                  tag = re.sub(r'\s+fetchpriority=["\'][^"\']+["\']', '', tag, flags=re.I)
                  tag = re.sub(r'\s+loading=["\'][^"\']+["\']', '', tag, flags=re.I)
                  tag = re.sub(r'\s+decoding=["\'][^"\']+["\']', '', tag, flags=re.I)
                  sm = re.search(r'src=["\']([^"\']+)["\']', tag, re.I)
                  src = sm.group(1) if sm else ''
                  is_priority = bool(priority.get(page.name) and priority[page.name] in src)
                  attrs = ' loading="eager" decoding="async" fetchpriority="high"' if is_priority else ' loading="lazy" decoding="async"'
                  return tag[:-1] + attrs + '>'
              text = re.sub(r'<img\b[^>]*>', fix, text, flags=re.I)
              page.write_text(text, encoding='utf-8')

          Path('.github/workflows/fix-image-loading-priority.yml').unlink(missing_ok=True)
          PY
      - name: Commit loading cleanup
        run: |
          git config user.name "portfolio-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Normalize portfolio image loading priorities"
          git push
