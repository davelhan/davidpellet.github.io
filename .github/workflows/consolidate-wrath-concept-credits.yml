name: Consolidate Wrath concept credits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-wrath-concept-credits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate concept art credits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wrath-of-the-druids.html')
          text = p.read_text(encoding='utf-8')

          replacements = [
              ('<div class="role-row"><b>Concept Art</b><span>Arnaud Kleindienst, Lucas Leger</span></div>',
               '<div class="role-row"><b>Concept Art</b><span>Arnaud Kleindienst, Lucas Leger, Quentin Gillet</span></div>'),
              ('<div class="role-row"><b>Character Concept Art</b><span>Lucas Leger, Arnaud Kleindienst, Quentin Gillet</span></div>', ''),
              ('<div class="credit"><h3>Concept Art</h3><p>Arnaud Kleindienst, Lucas Leger</p></div>',
               '<div class="credit"><h3>Concept Art</h3><p>Arnaud Kleindienst, Lucas Leger, Quentin Gillet</p></div>'),
              ('<div class="credit"><h3>Character Concept Art</h3><p>Lucas Leger, Arnaud Kleindienst, Quentin Gillet</p></div>', ''),
          ]

          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'Expected block not found: {old[:80]}')
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrath-of-the-druids.html
          git diff --cached --check
          git commit -m "Consolidate Wrath concept art credits"
          git push
