name: One-time portfolio image optimization

on:
  push:
    paths:
      - '.github/workflows/optimize-portfolio-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize used portfolio images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          pages = [
              Path('index.html'),
              Path('wrath-of-the-druids.html'),
              Path('the-kib.html'),
              Path('ghost-recon.html'),
              Path('south-park-phone-destroyer.html'),
              Path('visual-development.html'),
          ]

          img_re = re.compile(r'<img\b[^>]*?\bsrc=["\']([^"\']+)["\'][^>]*>', re.I)
          used = set()
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for src in img_re.findall(text):
                  if src.startswith('./assets/'):
                      used.add(src[2:])

          replacements = {}
          stats = []
          web_root = Path('assets/web')

          for rel in sorted(used):
              src = Path(rel)
              if not src.exists() or src.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}:
                  continue

              # Existing webp files are already compressed; keep them unless very large.
              try:
                  with Image.open(src) as im:
                      im.load()
                      original_size = src.stat().st_size
                      w, h = im.size

                      # Portfolio display rarely benefits from >2400 px on the long edge.
                      max_edge = 2400
                      scale = min(1.0, max_edge / max(w, h))
                      if scale < 1.0:
                          new_size = (max(1, round(w*scale)), max(1, round(h*scale)))
                          im = im.resize(new_size, Image.Resampling.LANCZOS)

                      has_alpha = im.mode in ('RGBA','LA') or ('transparency' in im.info)
                      if has_alpha:
                          im = im.convert('RGBA')
                      else:
                          im = im.convert('RGB')

                      relative_inside_assets = src.relative_to('assets')
                      out = web_root / relative_inside_assets
                      out = out.with_suffix('.webp')
                      out.parent.mkdir(parents=True, exist_ok=True)

                      save_kwargs = {'format':'WEBP','method':6}
                      if has_alpha:
                          save_kwargs.update({'quality':88,'lossless':False,'alpha_quality':95})
                      else:
                          save_kwargs.update({'quality':84})
                      im.save(out, **save_kwargs)
                      optimized_size = out.stat().st_size

                      # Use the optimized file only when it gives a meaningful saving.
                      if optimized_size < original_size * 0.92 or src.suffix.lower() != '.webp':
                          replacements['./' + rel] = './' + out.as_posix()
                          stats.append((rel, original_size, optimized_size, w, h))
                      else:
                          out.unlink(missing_ok=True)
              except Exception as exc:
                  print(f'SKIP {src}: {exc}')

          # Update sources and loading behavior.
          hero_hints = {
              'index.html': 'david-pellet-redleader-bp-garage-01',
              'wrath-of-the-druids.html': 'connacht-lackanscaul',
          }

          for page in pages:
              text = page.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(f'src="{old}"', f'src="{new}"')
                  text = text.replace(f"src='{old}'", f"src='{new}'")

              def add_loading(match):
                  tag = match.group(0)
                  if 'loading=' in tag or 'src=' not in tag:
                      return tag
                  srcm = re.search(r'\bsrc=["\']([^"\']+)["\']', tag, re.I)
                  src = srcm.group(1) if srcm else ''
                  hint = hero_hints.get(page.name)
                  eager = bool(hint and hint in src)
                  if eager:
                      attrs = ' loading="eager" decoding="async" fetchpriority="high"'
                  else:
                      attrs = ' loading="lazy" decoding="async"'
                  return tag[:-1] + attrs + '>'

              text = re.sub(r'<img\b[^>]*>', add_loading, text, flags=re.I)
              page.write_text(text, encoding='utf-8')

          print('\nOPTIMIZATION SUMMARY')
          total_before = total_after = 0
          for rel, before, after, w, h in stats:
              total_before += before
              total_after += after
              print(f'{rel}: {before/1024/1024:.2f} MB -> {after/1024/1024:.2f} MB ({w}x{h})')
          if total_before:
              print(f'TOTAL USED ASSETS: {total_before/1024/1024:.2f} MB -> {total_after/1024/1024:.2f} MB')
              print(f'SAVING: {(1-total_after/total_before)*100:.1f}%')

          workflow = Path('.github/workflows/optimize-portfolio-images.yml')
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit optimized web assets
        shell: bash
        run: |
          git config user.name "portfolio-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimize portfolio images for web"
          git push
