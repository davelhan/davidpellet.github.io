name: One-time portfolio image optimization

on:
  push:
    paths:
      - '.github/workflows/optimize-portfolio-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build optimized WebP assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          pages = [Path(x) for x in (
              'index.html',
              'wrath-of-the-druids.html',
              'the-kib.html',
              'ghost-recon.html',
              'south-park-phone-destroyer.html',
              'visual-development.html',
          )]

          pattern = re.compile(r'<img[^>]+src=["\']([^"\']+)["\']', re.I)
          used = set()
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for src in pattern.findall(text):
                  if src.startswith('./assets/') and '/web/' not in src:
                      used.add(src[2:])

          replacements = {}
          before_total = 0
          after_total = 0
          count = 0

          for rel in sorted(used):
              src = Path(rel)
              if not src.exists() or src.suffix.lower() not in {'.jpg', '.jpeg', '.png', '.webp'}:
                  continue
              try:
                  before = src.stat().st_size
                  with Image.open(src) as im:
                      im.load()
                      w, h = im.size
                      scale = min(1.0, 2400 / max(w, h))
                      if scale < 1:
                          im = im.resize((round(w*scale), round(h*scale)), Image.Resampling.LANCZOS)
                      alpha = im.mode in ('RGBA', 'LA') or 'transparency' in im.info
                      im = im.convert('RGBA' if alpha else 'RGB')

                      out = Path('assets/web') / src.relative_to('assets')
                      out = out.with_suffix('.webp')
                      out.parent.mkdir(parents=True, exist_ok=True)
                      im.save(out, 'WEBP', quality=86 if alpha else 84, method=6)

                  after = out.stat().st_size
                  # Always use generated WebP for JPEG/PNG. For existing WebP, only replace if smaller.
                  if src.suffix.lower() != '.webp' or after < before * 0.92:
                      replacements['./' + src.as_posix()] = './' + out.as_posix()
                      before_total += before
                      after_total += after
                      count += 1
                      print(f'{src}: {before/1048576:.2f} MB -> {after/1048576:.2f} MB')
                  else:
                      out.unlink(missing_ok=True)
              except Exception as exc:
                  print(f'SKIP {src}: {exc}')

          hero_tokens = {
              'index.html': 'david-pellet-redleader-bp-garage-01',
              'wrath-of-the-druids.html': 'connacht-lackanscaul',
          }

          for page in pages:
              text = page.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(f'src="{old}"', f'src="{new}"')
                  text = text.replace(f"src='{old}'", f"src='{new}'")

              def tune(match):
                  tag = match.group(0)
                  src_match = re.search(r'src=["\']([^"\']+)["\']', tag, re.I)
                  src = src_match.group(1) if src_match else ''
                  eager = hero_tokens.get(page.name, '') in src
                  if 'loading=' not in tag:
                      tag = tag[:-1] + (' loading="eager"' if eager else ' loading="lazy"') + '>'
                  if 'decoding=' not in tag:
                      tag = tag[:-1] + ' decoding="async">'
                  if eager and 'fetchpriority=' not in tag:
                      tag = tag[:-1] + ' fetchpriority="high">'
                  return tag

              text = re.sub(r'<img\b[^>]*>', tune, text, flags=re.I)
              page.write_text(text, encoding='utf-8')

          print(f'OPTIMIZED {count} used images')
          if before_total:
              print(f'TOTAL: {before_total/1048576:.2f} MB -> {after_total/1048576:.2f} MB')
              print(f'SAVING: {(1-after_total/before_total)*100:.1f}%')

          Path('.github/workflows/optimize-portfolio-images.yml').unlink(missing_ok=True)
          PY

      - name: Commit optimized assets
        shell: bash
        run: |
          git config user.name "portfolio-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimize portfolio images for web"
          git push
