name: Update Wrath leadership copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-wrath-leadership-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update leadership sentence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wrath-of-the-druids.html')
          text = p.read_text(encoding='utf-8')
          old = 'Art direction was delivered through direct human leadership: sitting with artists, reviewing their work in context, clarifying the intention, making decisions and helping teams solve the visual problem without taking ownership away from them.'
          new = 'Art direction was delivered through direct human leadership: working closely with artists, leads and directors, reviewing work in context, clarifying intent, making decisions, and helping teams solve visual problems without taking ownership away from them.'
          if old not in text:
              raise RuntimeError('Expected leadership sentence not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrath-of-the-druids.html
          git diff --cached --check
          git commit -m "Refine Wrath leadership copy"
          git push
