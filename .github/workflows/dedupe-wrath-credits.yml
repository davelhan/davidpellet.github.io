name: Deduplicate Wrath credits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-wrath-credits.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace duplicate art team credits with leadership structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wrath-of-the-druids.html')
          text = p.read_text(encoding='utf-8')

          old = '<div class="team-block"><h3>Art Team</h3><div class="role-row"><b>Lead Artist</b><span>Alexandre Lutz</span></div><div class="role-row"><b>Concept Art</b><span>Arnaud Kleindienst, Lucas Leger, Quentin Gillet</span></div><div class="role-row"><b>Level Art</b><span>Corentin Marquet, Nicolas Gorszczyk, Natanael Millet, Raphael Thiessard, Anthony Lemetayer, Jerome Rajcek, Quentin Donnaint, Cristel Mrowka</span></div><div class="role-row"><b>Lighting Art</b><span>Laurent Harduin, Ines Helmer</span></div><div class="role-row"><b>Technical Art</b><span>Joao Pereira Lemos Costa, Gery Arduino</span></div><div class="role-row"><b>Terrain Art</b><span>Robert Farrand</span></div><div class="role-row"><b>VFX Art</b><span>Hugo Marouzé, Anaïs Riff</span></div><div class="role-row"><b>Material Art</b><span>Ludovic Petiot</span></div><div class="role-row"><b>Lead Character Artist</b><span>Eric Moreno</span></div><div class="role-row"><b>Character Art</b><span>Loïc Sprimont, Arthur Gatineau, Romain Truchard, Mike-Amir El Frangi, Jason De Loos, Ye Wen Xiang</span></div><div class="role-row"><b>Character Rig / Technical Art</b><span>Thomas Vialetto</span></div></div>'

          new = '<div class="team-block"><h3>Leadership Structure</h3><div class="role-row"><b>Art Direction</b><span>David Pellet, overall visual direction and cross-discipline alignment.</span></div><div class="role-row"><b>Lead Artist</b><span>Alexandre Lutz, supporting day-to-day art execution and coordination across the team.</span></div><div class="role-row"><b>Creative Partners</b><span>Content Director and Narrative Director, close collaboration on world-building and the visual development of main and secondary narrative characters.</span></div><div class="role-row"><b>Discipline Leads</b><span>Day-to-day ownership of execution within each art discipline, aligned around the shared visual target.</span></div><div class="role-row"><b>Focused Intervention</b><span>Direct artist reviews when fine tuning, difficult visual decisions or final quality alignment required it.</span></div></div>'

          if old not in text:
              raise RuntimeError('Expected duplicate Art Team block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrath-of-the-druids.html
          git diff --cached --check
          git commit -m "Remove duplicate Wrath team credits"
          git push
