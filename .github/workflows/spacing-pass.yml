name: One-time portfolio spacing pass

on:
  push:
    paths:
      - '.github/workflows/spacing-pass.yml'

permissions:
  contents: write

jobs:
  apply-spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply compact editorial spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '<!-- SPACING_PASS_V1 -->'
          overrides = {
            'index.html': r'''
          .hero{min-height:auto!important;padding:118px 0 40px!important;display:block!important;align-items:initial!important}
          .proof-strip{margin-top:32px!important;padding:18px 0!important}
          .section{padding:96px 0!important}
          .section-head{margin-bottom:52px!important}
          .projects{gap:78px!important}
          .approach-card{min-height:250px!important;padding:32px!important}
          .approach-card h3{margin:36px 0 14px!important}
          .about-grid{gap:56px!important}
          .contact{padding:96px 0 42px!important}
          .contact-links{margin-top:32px!important}
          footer{margin-top:70px!important}
          @media(max-width:620px){.hero{padding-top:94px!important}.section{padding:72px 0!important}.projects{gap:58px!important}}
          ''',
            'wrath-of-the-druids.html': r'''
          .hero{padding:50px 0 36px!important}
          .hero-media{margin-top:32px!important}
          .section{padding:92px 0!important}
          .section-grid{gap:46px!important}
          .scope-grid,.method-grid,.docs-grid,.gallery-grid,.credits{margin-top:24px!important}
          .method-card{min-height:250px!important}
          .footer{padding:32px 0 48px!important}
          @media(max-width:650px){.section{padding:68px 0!important}}
          ''',
            'the-kib.html': r'''
          .hero{padding:50px 0 38px!important}
          .meta{margin-top:30px!important}
          .section{padding:92px 0!important}
          .section-grid{gap:48px!important}
          .cards,.pipeline{margin-top:24px!important}
          .kib-gallery{gap:22px!important;margin-top:32px!important}
          .kib-columns,.kib-stack{gap:16px!important}
          .quote{margin-top:22px!important}
          footer{padding:32px 0 48px!important}
          @media(max-width:680px){.section{padding:68px 0!important}}
          ''',
            'ghost-recon.html': r'''
          .hero{padding:50px 0 38px!important}
          .meta{margin-top:30px!important}
          .section{padding:92px 0!important}
          .section-grid{gap:46px!important}
          .timeline,.team-grid,.visuals,.pipeline{margin-top:24px!important}
          .callout{margin-top:22px!important}
          footer{padding:32px 0 48px!important}
          @media(max-width:650px){.section{padding:68px 0!important}}
          ''',
            'south-park-phone-destroyer.html': r'''
          .hero{padding:50px 0 38px!important}
          .meta{margin-top:30px!important}
          .section{padding:92px 0!important}
          .section-grid{gap:46px!important}
          .cards,.rules,.proofs,.visuals,.pipeline{margin-top:24px!important}
          .callout{margin-top:22px!important}
          .footer{padding:32px 0 48px!important}
          @media(max-width:650px){.section{padding:68px 0!important}}
          ''',
            'visual-development.html': r'''
          .hero{padding:50px 0 40px!important}
          .meta{margin-top:30px!important}
          .section{padding:92px 0!important}
          .section-grid{gap:46px!important}
          .feature{margin-top:28px!important}
          .duo{gap:18px!important;margin-top:24px!important}
          .orthos{gap:12px!important;margin-top:24px!important}
          .system-note{margin-top:18px!important}
          .footer{padding:32px 0 48px!important}
          @media(max-width:650px){.section{padding:68px 0!important}}
          '''
          }

          for filename, css in overrides.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              block = f"\n{marker}\n<style>\n{css.strip()}\n</style>\n"
              if '</head>' not in text:
                  raise RuntimeError(f'Missing </head> in {filename}')
              text = text.replace('</head>', block + '</head>', 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/spacing-pass.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit spacing pass
        shell: bash
        run: |
          git config user.name "portfolio-spacing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Tighten spacing across portfolio"
          git push
